<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Composting With Coffee — Back to Eden Fest 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">

  <!-- Hidden Leaf Farm brand font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ===============================
       Hidden Leaf Farm Reveal.js Theme
       Based on Canva Brand Kit
       =============================== */

    :root {
      --hlf-green: #2A5C2A;
      --hlf-accent-green: #6BBF59;
      --hlf-brown: #8B5E3C;
      --hlf-cream: #F5F1E8;
      --hlf-charcoal: #333333;
    }

    .hlf-logo-container {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
    }

    .hlf-logo {
      width: 70px;
      opacity: 0.9;
    }

    .reveal {
      background: var(--hlf-cream);
      color: var(--hlf-charcoal);
      font-family: 'Montserrat', sans-serif;
    }

    .reveal h1,
    .reveal h2,
    .reveal h3 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: var(--hlf-green) !important;
      letter-spacing: 0.5px;
    }

    .reveal section {
      font-size: 1.2rem;
      line-height: 1.5;
      padding: 20px;
    }

    ul { margin-top: 10px; }
    li { margin-bottom: 8px; }

    a {
      color: var(--hlf-accent-green);
      text-decoration: none;
      font-weight: 600;
    }

    hr {
      border: 0;
      height: 2px;
      background: var(--hlf-accent-green);
      margin: 20px 0;
    }

    .reveal .slide-number {
      color: var(--hlf-brown);
    }

    img {
      border-radius: 8px;
      max-width: 100%;
    }

    .hlf-button {
      display: inline-block;
      padding: 10px 18px;
      background: var(--hlf-green);
      color: white;
      border-radius: 6px;
      font-weight: 600;
      margin-top: 10px;
    }

    .leaf-accent {
      color: var(--hlf-accent-green);
      font-size: 1.4rem;
    }
/* ===============================
Hidden Leaf Farm — Title Slide
=============================== */

.title-slide {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
  text-align: center;
  background: var(--hlf-cream);
  padding: 40px;
}

.title-accent-bar {
  width: 100%;
  height: 12px;
  background: var(--hlf-green);
  margin-bottom: 30px;
  border-radius: 4px;
}

.hlf-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 40px;
  background-image: url('soil-texture.png');
  background-size: cover;
  background-position: center;
  opacity: 0.35;
  z-index: 9000;
}

.title-content h1 {
  font-size: 3rem;
  color: var(--hlf-green);
  margin-bottom: 0.5rem;
}

.title-content h3 {
  font-size: 1.6rem;
  color: var(--hlf-brown);
  margin-bottom: 1.5rem;
}

.title-sub p {
  font-size: 1.1rem;
  margin: 4px 0;
  color: var(--hlf-charcoal);
}

.qr-note {
  margin-top: 2rem;
  font-size: 1rem;
  color: var(--hlf-accent-green);
  font-weight: 600;
}

  </style>
</head>


<body>
  <div class="hlf-logo-container">
    <img src="logo.png" alt="Hidden Leaf Farm Logo" class="hlf-logo">
  </div>
  <div class="reveal">
    <div class="slides">
      <section class="title-slide">
        <div class="title-accent-bar"></div>
        <div class="title-content">
          <h1>Composting With Coffee</h1>
          <h3>Soil Biology for Real People</h3>

          <div class="title-sub">
            <p>Christopher Calderon</p>
            <p>Hidden Leaf Farm • Greenville, NC</p>
            <p>Master Gardener • SCG Recovery Specialist</p>
          </div>

          <div class="qr-note">
            <p>Scan the QR code to follow along</p>
          </div>
        </div>
      </section>
      <div class="hlf-footer"></div>
      <section data-markdown="slides.md"
               data-separator="---"
               data-separator-vertical="--"
               data-charset="utf-8">
      </section>
    </div>
  </div>

  <!-- Reveal.js scripts -->
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: true,
      mobileView: true,
      plugins: [ RevealMarkdown ]
    });
  </script>
</body>
</html>
